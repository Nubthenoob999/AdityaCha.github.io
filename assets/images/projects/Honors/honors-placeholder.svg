    <path d="M160 0 V900" stroke="url(#line)" stroke-width="3"/>
    <path d="M460 0 V900" stroke="url(#line)" stroke-width="3"/>
    <path d="M760 0 V900" stroke="url(#line)" stroke-width="3"/>
    <path d="M1060 0 V900" stroke="url(#line)" stroke-width="3"/>
    <path d="M1360 0 V900" stroke="url(#line)" stroke-width="3"/>
  </g>
  <rect x="210" y="210" width="1180" height="480" rx="32" fill="none" stroke="#30363d" stroke-width="4" stroke-dasharray="18 14"/>
  <text x="800" y="460" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" text-anchor="middle">Image Placeholder</text>
  <text x="800" y="535" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle">Replace with final Honors project media</text>
