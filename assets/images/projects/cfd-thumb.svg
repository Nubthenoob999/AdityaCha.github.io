<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="CFD Projects thumbnail placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#23324a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#grid)" opacity="0.55"/>
  <g opacity="0.9">
    <rect x="120" y="220" width="560" height="320" rx="20" fill="none" stroke="#e5e7eb" stroke-width="6"/>
    <path d="M140 460 C 250 360, 390 340, 520 360 C 610 375, 660 410, 680 440"
          fill="none" stroke="#60a5fa" stroke-width="10" opacity="0.75"/>
    <path d="M140 420 C 260 320, 410 290, 550 320 C 640 340, 680 380, 690 405"
          fill="none" stroke="#a78bfa" stroke-width="10" opacity="0.5"/>
  </g>
  <text x="60" y="90" fill="#e5e7eb" font-family="ui-sans-serif, system-ui" font-size="26">CFD Hub</text>
  <text x="60" y="125" fill="#9ca3af" font-family="ui-sans-serif, system-ui" font-size="16">placeholder thumbnail</text>
</svg>
