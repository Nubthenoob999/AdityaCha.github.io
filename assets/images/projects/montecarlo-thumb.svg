<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="OpenRocket Monte Carlo thumbnail placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#23324a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#grid)" opacity="0.55"/>
  <g stroke="#e5e7eb" stroke-width="4" fill="none" opacity="0.9">
    <circle cx="280" cy="470" r="160"/>
    <circle cx="360" cy="410" r="160" opacity="0.6"/>
    <circle cx="430" cy="350" r="160" opacity="0.35"/>
  </g>
  <text x="60" y="90" fill="#e5e7eb" font-family="ui-sans-serif, system-ui" font-size="26">Monte Carlo</text>
  <text x="60" y="125" fill="#9ca3af" font-family="ui-sans-serif, system-ui" font-size="16">placeholder thumbnail</text>
</svg>
