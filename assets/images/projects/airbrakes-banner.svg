<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="OpenRocket Airbrakes Plugin banner placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23324a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)" opacity="0.55"/>
  <g transform="translate(250,120)" fill="none" stroke="#e5e7eb" stroke-width="6" opacity="0.9">
    <path d="M120 40 L 900 40" />
    <path d="M120 40 L 120 260" />
    <path d="M900 40 L 900 260" />
    <path d="M120 260 L 900 260" />
    <path d="M760 150 L 900 110" opacity="0.8"/>
    <path d="M760 150 L 900 190" opacity="0.8"/>
  </g>
  <g transform="translate(1180,120)" opacity="0.9">
    <rect x="-10" y="-10" width="300" height="120" rx="10" fill="#0b1220" stroke="#334155"/>
    <text x="20" y="35" fill="#e5e7eb" font-family="ui-sans-serif, system-ui" font-size="22">Placeholder banner</text>
    <text x="20" y="70" fill="#9ca3af" font-family="ui-sans-serif, system-ui" font-size="16">Replace with your image</text>
  </g>
</svg>
