title: "Aditya Chadha"
description: "Aerospace simulation and software engineering for flight systems"
url: "https://adityacha.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.26.2"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
permalink: /:categories/:title/

locale: en-US

author:
  name: "Aditya Chadha"
  email: "adityachadha2203@gmail.com"
  links:
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/adityachadha03"

minimal_mistakes_skin: "dark_modern"
breadcrumbs: true
search: true
read_time: false

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      classes: wide
      author_profile: false
      toc: true
      toc_sticky: true
      share: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      classes: wide

include:
  - _pages

# GitHub Pages baseurl notes
# User site set baseurl to empty string
# Project site set baseurl to "/REPO"
